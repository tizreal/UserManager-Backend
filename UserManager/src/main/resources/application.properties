spring.application.name=UserManager

# ── Server Configuration ────────────────────────────────────── 
# Port the server listens on (default 8080) 
server.port=${PORT:8080} 
# All API endpoints will be prefixed with /api 
server.servlet.context-path=/api
# Trust X-Forwarded-For only from internal proxy addresses (Tomcat RemoteIpValve), so
# rate limiting sees the real client IP behind Render's proxy.
server.forward-headers-strategy=native

# ── Abuse protection ───────────────────────────────────────────
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

# ── Maintenance mode ───────────────────────────────────────────
# true = every endpoint except /health returns 503 unless the request has the header
# X-Maintenance-Key: <MAINTENANCE_BYPASS_KEY>. An empty key cannot be used to bypass.
app.maintenance.enabled=${MAINTENANCE_MODE:false}
app.maintenance.bypass-key=${MAINTENANCE_BYPASS_KEY:}
 
# ── Database Configuration ──────────────────────────────────── 
# Replace 'root' with your actual PostgreSQL password 
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
 
# ── JPA / Hibernate Configuration ───────────────────────────── 
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect 

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks
# that the entities match it and never modifies the database.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Schema migrations (Flyway) ────────────────────────────────
# An existing database without Flyway history is baselined at V1 (the pre-Flyway
# schema), so only V2+ run against it. A fresh database runs V1+.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
 
# ── JWT Configuration ───────────────────────────────────────── 
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=604800000 
 
# ── Mail Configuration ──────────────────────────────────────── 
# Replace with YOUR Gmail and Google App Password (Step 22) 
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000 
spring.mail.properties.mail.smtp.timeout=3000 
spring.mail.properties.mail.smtp.writetimeout=5000 

resend.api.key=${RESEND_API_KEY}
resend.from.email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
 
# ── Logging Configuration ───────────────────────────────────── 
# INFO by default; DEBUG can be enabled per environment. Tokens, passwords and reset
# links are never logged at any level.
logging.level.web=${WEB_LOG_LEVEL:INFO}
logging.level.com.tca.UserManager=${LOG_LEVEL:INFO}
logging.level.org.hibernate.type=INFO 
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n 
 
# ── Import YAML config file ──────────────────────────────────── 
spring.config.import=classpath:config.yml 